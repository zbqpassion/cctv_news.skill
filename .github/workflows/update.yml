name: Daily update

on:
  workflow_dispatch:
    inputs:
      date:
        description: '要补抓的日期，格式 YYYYMMDD；留空则抓当天'
        required: false
        type: string
  schedule:
    # 服务器定时器为主；北京时间 23:50 和次日 00:30 由 GitHub Actions 兜底。
    - cron: '50 15 * * *'
    - cron: '30 16 * * *'

concurrency:
  group: daily-update-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Daily Sync
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Setup git
        run: |
          git config --local user.email "github-actions[bot]@github.com"
          git config --local user.name "github-actions[bot]"
      - name: Build
        env:
          FETCH_DATE: ${{ github.event.inputs.date || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          bun install --frozen-lockfile

          if [ -n "$FETCH_DATE" ]; then
            TARGET_DATE="$FETCH_DATE"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            TARGET_DATE="$(date -u +%Y%m%d)"
          else
            TARGET_DATE="$(TZ=Asia/Shanghai date +%Y%m%d)"
          fi

          if [ -f "news/${TARGET_DATE}.md" ]; then
            echo "news/${TARGET_DATE}.md already exists; skip fetch."
          else
            bun run fetch -- "$TARGET_DATE"
          fi

          bun run make-index
      - name: Commit changes
        id: commit
        run: |
          git add INDEX.md news dump_htmls
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "[bot] AUTO UPDATE"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
      - name: Push main branch
        if: steps.commit.outputs.has_changes == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
