name: Daily update

on:
  workflow_dispatch:
    inputs:
      date:
        description: '要补抓的日期，格式 YYYYMMDD；留空则抓当天'
        required: false
        type: string
  schedule:
    # 北京时间每天晚上 9 点执行，获取当天的数据
    - cron: '0 13 * * *'

jobs:
  update:
    name: Daily Sync
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup git
        run: |
          git config --local user.email "github-actions[bot]@github.com"
          git config --local user.name "github-actions[bot]"
      - name: Build
        env:
          FETCH_DATE: ${{ github.event.inputs.date || '' }}
        run: |
          bun install
          if [ -n "$FETCH_DATE" ]; then
            bun run fetch -- "$FETCH_DATE"
          else
            bun run fetch
          fi
          bun run make-index
      - name: Commit changes
        run: |
          git add .
          git commit -m "[bot] AUTO UPDATE"
      - name: Push main branch
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
